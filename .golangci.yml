# golangci-lint v2 configuration. `make lint` runs the version pinned by
# GOLANGCI_LINT_VERSION in the Makefile, so local runs and CI agree.
# Stage 1 enables a baseline set of stable linters. Stricter checks (the
# spec-citation lint, error-coverage lint) live in the speccov tool and run
# as separate CI steps so the lint config stays minimal.
version: "2"

run:
  timeout: 5m

# Report every finding rather than the default per-linter and same-text caps,
# so one run lists the full set to fix.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - staticcheck
    - unused
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/lennylabs/podium
  exclusions:
    generated: lax
