<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" class="dg">
  <!--
    Identity and visibility flow. Every registry call carries an OAuth identity.
    The registry verifies the token, resolves claims, then evaluates the layer
    list per layer to produce the caller's effective view.
  -->
  <defs>
    <marker id="dg-arrow-identity-visibility-flow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="dg-arrow-head" d="M 0 0 L 11 6 L 0 12 z"/>
    </marker>
    <style>
      /*
        Colour comes from the site's design tokens. Inlined in the documentation
        site the site's own variables win, so the theme toggle drives the
        diagram. Standing alone (raw markdown on github.com, or the file opened
        directly) the fallbacks apply and follow the operating system setting.
        The block below is identical in every diagram; edit all of them together.
      */
      :root {
        --dg-ground: var(--surface, #ffffff);
        --dg-panel-fill: var(--surface-2, #fdfdf8);
        --dg-fill: var(--surface-3, #f5f3e9);
        --dg-fill-2: var(--chip, #eae7d9);
        --dg-accent-fill: var(--accent-wash, #fff3e2);
        --dg-accent-soft: var(--accent-strip, #ffeeda);
        --dg-ink: var(--ink, #14130f);
        --dg-meta: var(--meta, #63604f);
        --dg-faint: var(--faint, #6f6c5e);
        --dg-border: var(--border, #d9d5c6);
        --dg-accent: var(--accent-deep, #f2861a);
        --dg-accent-text: var(--link, #a8480a);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --dg-ground: var(--surface, #171b28);
          --dg-panel-fill: var(--surface-2, #1e2434);
          --dg-fill: var(--surface-3, #1b2030);
          --dg-fill-2: var(--chip, #212739);
          --dg-accent-fill: var(--accent-wash, rgba(255, 164, 36, 0.12));
          --dg-accent-soft: var(--accent-strip, rgba(255, 164, 36, 0.08));
          --dg-ink: var(--ink, #eaeef7);
          --dg-meta: var(--meta, #9aa3ba);
          --dg-faint: var(--faint, #7a8399);
          --dg-border: var(--border, #2b3145);
          --dg-accent: var(--accent-deep, #f2861a);
          --dg-accent-text: var(--link, #ffa424);
        }
      }

      .dg {
        font-family: var(--font-ui, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
      }

      .dg-bg { fill: var(--dg-ground); }

      .dg-panel { fill: var(--dg-panel-fill); stroke: var(--dg-border); stroke-width: 1.6; }
      .dg-card { fill: var(--dg-fill); stroke: var(--dg-ink); stroke-width: 1.8; }
      .dg-card-primary { fill: var(--dg-accent-fill); stroke: var(--dg-accent); stroke-width: 2.2; }
      .dg-card-strong { fill: var(--dg-fill-2); stroke: var(--dg-accent); stroke-width: 2.2; }
      .dg-card-quiet { fill: var(--dg-ground); stroke: var(--dg-meta); stroke-width: 1.4; }
      .dg-card-event { fill: var(--dg-accent-soft); stroke: var(--dg-accent); stroke-width: 1.8; stroke-dasharray: 6 5; }
      .dg-chip { fill: var(--dg-accent-soft); stroke: var(--dg-border); stroke-width: 1.2; }
      .dg-outline { fill: none; stroke: var(--dg-accent); stroke-width: 1.6; stroke-dasharray: 6 5; }

      .dg-title { font-size: 22px; fill: var(--dg-ink); }
      .dg-name { font-size: 17px; fill: var(--dg-ink); }
      .dg-lead { font-size: 15px; fill: var(--dg-meta); }
      .dg-sub { font-size: 14px; fill: var(--dg-meta); }
      .dg-label { font-size: 13px; fill: var(--dg-accent-text); letter-spacing: 0.06em; }
      .dg-label-quiet { font-size: 13px; fill: var(--dg-meta); letter-spacing: 0.06em; }
      .dg-note { font-size: 13px; fill: var(--dg-meta); font-style: italic; }
      .dg-foot { font-size: 13px; fill: var(--dg-faint); }
      .dg-mono { font-size: 13px; fill: var(--dg-ink); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }
      .dg-mono-accent { font-size: 13px; fill: var(--dg-accent-text); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }
      .dg-mono-quiet { font-size: 13px; fill: var(--dg-meta); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }

      .dg-line { fill: none; stroke: var(--dg-ink); stroke-width: 2; stroke-linecap: round; }
      .dg-line-accent { fill: none; stroke: var(--dg-accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 5; }
      .dg-line-quiet { fill: none; stroke: var(--dg-meta); stroke-width: 1.6; stroke-linecap: round; }
      .dg-guide { fill: none; stroke: var(--dg-border); stroke-width: 1.2; }
      .dg-divider { fill: none; stroke: var(--dg-border); stroke-width: 1.2; stroke-dasharray: 4 4; }

      .dg-arrow-head { fill: var(--dg-ink); }
      .dg-arrow-head-accent { fill: var(--dg-accent); }

      .dg-t-xs { font-size: 12px; }
      .dg-t-s { font-size: 13px; }
      .dg-t-m { font-size: 15px; }
      .dg-t-l { font-size: 18px; }
      .dg-t-xl { font-size: 21px; }
      .dg-t-2xl { font-size: 24px; }
      .dg-t-3xl { font-size: 28px; }
    </style>
  </defs>

  <rect class="dg-bg" width="1080" height="580"/>

  <text class="dg-title" x="40" y="42">Identity and visibility flow</text>
  <text class="dg-sub" x="40" y="64">Every registry call carries an OAuth identity. The registry uses it to compose the caller's effective view.</text>

  <!-- Caller -->
  <rect class="dg-card-strong" x="40" y="110" width="160" height="80" rx="8"/>
  <text class="dg-label" x="60" y="134">caller</text>
  <text class="dg-name dg-t-m" x="60" y="156">Alice</text>
  <text class="dg-mono" x="60" y="178">+ OAuth token</text>

  <!-- Arrow caller -> registry -->
  <path class="dg-line" d="M 200 150 L 240 150" marker-end="url(#dg-arrow-identity-visibility-flow)"/>

  <!-- Registry frame -->
  <rect class="dg-outline" x="240" y="100" width="700" height="100" rx="10"/>
  <text class="dg-label" x="252" y="120">podium server</text>

  <!-- Stage 1: verify -->
  <rect class="dg-card" x="252" y="128" width="200" height="64" rx="6"/>
  <text class="dg-name dg-t-m" x="268" y="152">1. Verify token</text>
  <text class="dg-sub dg-t-s" x="268" y="174">signature, expiry, audience</text>

  <path class="dg-line" d="M 452 160 L 478 160" marker-end="url(#dg-arrow-identity-visibility-flow)"/>

  <!-- Stage 2: resolve claims -->
  <rect class="dg-card" x="482" y="128" width="220" height="64" rx="6"/>
  <text class="dg-name dg-t-m" x="498" y="152">2. Resolve claims</text>
  <text class="dg-sub dg-t-s" x="498" y="174">subject, groups, tenant</text>

  <path class="dg-line" d="M 702 160 L 728 160" marker-end="url(#dg-arrow-identity-visibility-flow)"/>

  <!-- Stage 3: evaluate per layer -->
  <rect class="dg-card" x="732" y="128" width="196" height="64" rx="6"/>
  <text class="dg-name dg-t-m" x="748" y="152">3. Per-layer match</text>
  <text class="dg-sub dg-t-s" x="748" y="174">visible or hidden</text>

  <!-- Arrow registry -> output -->
  <path class="dg-line" d="M 940 150 L 966 150" marker-end="url(#dg-arrow-identity-visibility-flow)"/>

  <!-- Effective view output -->
  <rect class="dg-card-primary" x="970" y="108" width="100" height="84" rx="8"/>
  <text class="dg-label" x="986" y="132">effective</text>
  <text class="dg-name dg-t-m" x="986" y="158">view</text>

  <!-- Per-layer decision table -->
  <text class="dg-label" x="40" y="244">per-layer decision for Alice</text>

  <!-- Table headers -->
  <text class="dg-label" x="60" y="276">layer</text>
  <text class="dg-label" x="320" y="276">visibility rule</text>
  <text class="dg-label" x="620" y="276">alice's claims match?</text>
  <text class="dg-label" x="900" y="276">in view?</text>

  <!-- Row 1: org-defaults YES -->
  <rect class="dg-card-primary" x="40" y="290" width="1000" height="42" rx="6"/>
  <text class="dg-mono" x="60" y="316">org-defaults</text>
  <text class="dg-mono" x="320" y="316">organization: true</text>
  <text class="dg-sub" x="620" y="316">acme tenant member</text>
  <text class="dg-label" x="900" y="316">YES</text>

  <!-- Row 2: team-finance NO -->
  <rect class="dg-card-quiet" x="40" y="338" width="1000" height="42" rx="6"/>
  <text class="dg-mono" x="60" y="364">team-finance</text>
  <text class="dg-mono" x="320" y="364">groups: [finance]</text>
  <text class="dg-sub" x="620" y="364">not in finance group</text>
  <text class="dg-label-quiet" x="900" y="364">NO</text>

  <!-- Row 3: alice-personal YES -->
  <rect class="dg-card-primary" x="40" y="386" width="1000" height="42" rx="6"/>
  <text class="dg-mono" x="60" y="412">alice-personal</text>
  <text class="dg-mono" x="320" y="412">users: [alice@acme.com]</text>
  <text class="dg-sub" x="620" y="412">subject/email match</text>
  <text class="dg-label" x="900" y="412">YES</text>

  <!-- Row 4: marketing-public YES -->
  <rect class="dg-card-primary" x="40" y="434" width="1000" height="42" rx="6"/>
  <text class="dg-mono" x="60" y="460">marketing-public</text>
  <text class="dg-mono" x="320" y="460">public: true</text>
  <text class="dg-sub" x="620" y="460">always visible</text>
  <text class="dg-label" x="900" y="460">YES</text>

  <text class="dg-foot" x="40" y="510">Visibility evaluation runs on every registry call. Layers the caller cannot see are silently excluded; the response</text>
  <text class="dg-foot" x="40" y="528">contains no hint of their existence. Hidden parents merge server-side when a visible child declares extends:.</text>
  <text class="dg-foot" x="40" y="546">Public mode and filesystem-source deployments short-circuit visibility to true for every layer (no identity present).</text>
</svg>
