<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" class="dg">
  <!--
    podium sync watch mode (the long-running form invoked with the watch flag).
    The client subscribes to registry change events and re-materializes affected
    artifacts incrementally.
  -->
  <defs>
    <marker id="dg-arrow-sync-watch" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="dg-arrow-head" d="M 0 0 L 11 6 L 0 12 z"/>
    </marker>
    <marker id="dg-arrow-accent-sync-watch" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="dg-arrow-head-accent" d="M 0 0 L 11 6 L 0 12 z"/>
    </marker>
    <style>
      /*
        Colour comes from the site's design tokens. Inlined in the documentation
        site the site's own variables win, so the theme toggle drives the
        diagram. Standing alone (raw markdown on github.com, or the file opened
        directly) the fallbacks apply and follow the operating system setting.
        The block below is identical in every diagram; edit all of them together.
      */
      :root {
        --dg-ground: var(--surface, #ffffff);
        --dg-panel-fill: var(--surface-2, #fdfdf8);
        --dg-fill: var(--surface-3, #f5f3e9);
        --dg-fill-2: var(--chip, #eae7d9);
        --dg-accent-fill: var(--accent-wash, #fff3e2);
        --dg-accent-soft: var(--accent-strip, #ffeeda);
        --dg-ink: var(--ink, #14130f);
        --dg-meta: var(--meta, #63604f);
        --dg-faint: var(--faint, #6f6c5e);
        --dg-border: var(--border, #d9d5c6);
        --dg-accent: var(--accent-deep, #f2861a);
        --dg-accent-text: var(--link, #a8480a);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --dg-ground: var(--surface, #171b28);
          --dg-panel-fill: var(--surface-2, #1e2434);
          --dg-fill: var(--surface-3, #1b2030);
          --dg-fill-2: var(--chip, #212739);
          --dg-accent-fill: var(--accent-wash, rgba(255, 164, 36, 0.12));
          --dg-accent-soft: var(--accent-strip, rgba(255, 164, 36, 0.08));
          --dg-ink: var(--ink, #eaeef7);
          --dg-meta: var(--meta, #9aa3ba);
          --dg-faint: var(--faint, #7a8399);
          --dg-border: var(--border, #2b3145);
          --dg-accent: var(--accent-deep, #f2861a);
          --dg-accent-text: var(--link, #ffa424);
        }
      }

      .dg {
        font-family: var(--font-ui, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
      }

      .dg-bg { fill: var(--dg-ground); }

      .dg-panel { fill: var(--dg-panel-fill); stroke: var(--dg-border); stroke-width: 1.6; }
      .dg-card { fill: var(--dg-fill); stroke: var(--dg-ink); stroke-width: 1.8; }
      .dg-card-primary { fill: var(--dg-accent-fill); stroke: var(--dg-accent); stroke-width: 2.2; }
      .dg-card-strong { fill: var(--dg-fill-2); stroke: var(--dg-accent); stroke-width: 2.2; }
      .dg-card-quiet { fill: var(--dg-ground); stroke: var(--dg-meta); stroke-width: 1.4; }
      .dg-card-event { fill: var(--dg-accent-soft); stroke: var(--dg-accent); stroke-width: 1.8; stroke-dasharray: 6 5; }
      .dg-chip { fill: var(--dg-accent-soft); stroke: var(--dg-border); stroke-width: 1.2; }
      .dg-outline { fill: none; stroke: var(--dg-accent); stroke-width: 1.6; stroke-dasharray: 6 5; }

      .dg-title { font-size: 22px; fill: var(--dg-ink); }
      .dg-name { font-size: 17px; fill: var(--dg-ink); }
      .dg-lead { font-size: 15px; fill: var(--dg-meta); }
      .dg-sub { font-size: 14px; fill: var(--dg-meta); }
      .dg-label { font-size: 13px; fill: var(--dg-accent-text); letter-spacing: 0.06em; }
      .dg-label-quiet { font-size: 13px; fill: var(--dg-meta); letter-spacing: 0.06em; }
      .dg-note { font-size: 13px; fill: var(--dg-meta); font-style: italic; }
      .dg-foot { font-size: 13px; fill: var(--dg-faint); }
      .dg-mono { font-size: 13px; fill: var(--dg-ink); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }
      .dg-mono-accent { font-size: 13px; fill: var(--dg-accent-text); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }
      .dg-mono-quiet { font-size: 13px; fill: var(--dg-meta); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }

      .dg-line { fill: none; stroke: var(--dg-ink); stroke-width: 2; stroke-linecap: round; }
      .dg-line-accent { fill: none; stroke: var(--dg-accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 5; }
      .dg-line-quiet { fill: none; stroke: var(--dg-meta); stroke-width: 1.6; stroke-linecap: round; }
      .dg-guide { fill: none; stroke: var(--dg-border); stroke-width: 1.2; }
      .dg-divider { fill: none; stroke: var(--dg-border); stroke-width: 1.2; stroke-dasharray: 4 4; }

      .dg-arrow-head { fill: var(--dg-ink); }
      .dg-arrow-head-accent { fill: var(--dg-accent); }

      .dg-t-xs { font-size: 12px; }
      .dg-t-s { font-size: 13px; }
      .dg-t-m { font-size: 15px; }
      .dg-t-l { font-size: 18px; }
      .dg-t-xl { font-size: 21px; }
      .dg-t-2xl { font-size: 24px; }
      .dg-t-3xl { font-size: 28px; }
    </style>
  </defs>

  <rect class="dg-bg" width="1080" height="480"/>

  <text class="dg-title" x="40" y="42">podium sync watch mode (server-source registry)</text>
  <text class="dg-sub" x="40" y="64">The watcher subscribes to registry events and re-materializes the changed artifacts incrementally.</text>

  <!-- Registry on left -->
  <rect class="dg-card-primary" x="40" y="120" width="220" height="100" rx="8"/>
  <text class="dg-label" x="60" y="146">podium server</text>
  <text class="dg-name" x="60" y="170">change events</text>
  <text class="dg-sub" x="60" y="192">SSE stream over HTTP,</text>
  <text class="dg-sub" x="60" y="210">filtered to caller's view</text>

  <!-- Arrow registry -> watcher step 1, with the event payload labelled below the arrow. -->
  <path class="dg-line-accent" d="M 260 170 L 516 170" marker-end="url(#dg-arrow-accent-sync-watch)"/>

  <!-- Event payload label (positioned beneath the arrow) -->
  <rect class="dg-card-event" x="306" y="184" width="168" height="44" rx="6"/>
  <text class="dg-mono" x="320" y="204">{artifact_id,</text>
  <text class="dg-mono" x="320" y="220">version, change}</text>

  <!-- Watcher loop on right -->
  <rect class="dg-panel" x="500" y="100" width="540" height="240" rx="10"/>
  <text class="dg-label" x="520" y="124">podium sync (watching)</text>

  <!-- Stage 1: receive -->
  <rect class="dg-card" x="520" y="140" width="160" height="64" rx="6"/>
  <text class="dg-name dg-t-m" x="536" y="164">1. Receive event</text>
  <text class="dg-sub" x="536" y="186">debounce same id</text>

  <path class="dg-line" d="M 680 172 L 712 172" marker-end="url(#dg-arrow-sync-watch)"/>

  <!-- Stage 2: fetch -->
  <rect class="dg-card" x="716" y="140" width="160" height="64" rx="6"/>
  <text class="dg-name dg-t-m" x="732" y="164">2. Fetch manifest</text>
  <text class="dg-sub" x="732" y="186">load_artifact</text>

  <path class="dg-line" d="M 876 172 L 908 172" marker-end="url(#dg-arrow-sync-watch)"/>

  <!-- Stage 3: adapt -->
  <rect class="dg-card" x="912" y="140" width="116" height="64" rx="6"/>
  <text class="dg-name dg-t-m" x="928" y="164">3. Adapt</text>
  <text class="dg-sub" x="928" y="186">harness</text>

  <!-- Down arrow to stage 4 -->
  <path class="dg-line" d="M 970 204 L 970 240 L 802 240 L 802 252" marker-end="url(#dg-arrow-sync-watch)"/>

  <!-- Stage 4: write -->
  <rect class="dg-card" x="716" y="256" width="160" height="64" rx="6"/>
  <text class="dg-name dg-t-m" x="732" y="280">4. Atomic write</text>
  <text class="dg-sub" x="732" y="302">.tmp + rename</text>

  <!-- Loop arrow back to stage 1 -->
  <path class="dg-line" d="M 716 288 L 600 288 L 600 204" marker-end="url(#dg-arrow-sync-watch)"/>
  <text class="dg-note" x="540" y="280">await next event</text>

  <!-- Output: target tree -->
  <rect class="dg-card-strong" x="500" y="370" width="540" height="60" rx="8"/>
  <text class="dg-label" x="520" y="394">target tree</text>
  <text class="dg-mono" x="520" y="418">.claude/agents/, .cursor/rules/, …</text>

  <!-- Arrow from write to target -->
  <path class="dg-line" d="M 796 320 L 796 366" marker-end="url(#dg-arrow-sync-watch)"/>

  <text class="dg-foot" x="40" y="450">Event types: artifact_added, artifact_updated, artifact_removed, layer_changed. Removals delete from the target.</text>
  <text class="dg-foot" x="40" y="468">A change to a parent (via extends:) re-emits events for every dependent child the caller can see.</text>
</svg>
