<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" class="dg">
  <!--
    Two catalog sources side by side. Two panels of equal width (520 each) with
    a vertical divider at x=540. Each panel carries its own title, primary card,
    and a miniature flow underneath.
  -->
  <defs>
    <marker id="dg-arrow-modes-filesystem-vs-server" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="dg-arrow-head" d="M 0 0 L 11 6 L 0 12 z"/>
    </marker>
    <style>
      /*
        Colour comes from the site's design tokens. Inlined in the documentation
        site the site's own variables win, so the theme toggle drives the
        diagram. Standing alone (raw markdown on github.com, or the file opened
        directly) the fallbacks apply and follow the operating system setting.
        The block below is identical in every diagram; edit all of them together.
      */
      :root {
        --dg-ground: var(--surface, #ffffff);
        --dg-panel-fill: var(--surface-2, #fdfdf8);
        --dg-fill: var(--surface-3, #f5f3e9);
        --dg-fill-2: var(--chip, #eae7d9);
        --dg-accent-fill: var(--accent-wash, #fff3e2);
        --dg-accent-soft: var(--accent-strip, #ffeeda);
        --dg-ink: var(--ink, #14130f);
        --dg-meta: var(--meta, #63604f);
        --dg-faint: var(--faint, #6f6c5e);
        --dg-border: var(--border, #d9d5c6);
        --dg-accent: var(--accent-deep, #f2861a);
        --dg-accent-text: var(--link, #a8480a);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --dg-ground: var(--surface, #171b28);
          --dg-panel-fill: var(--surface-2, #1e2434);
          --dg-fill: var(--surface-3, #1b2030);
          --dg-fill-2: var(--chip, #212739);
          --dg-accent-fill: var(--accent-wash, rgba(255, 164, 36, 0.12));
          --dg-accent-soft: var(--accent-strip, rgba(255, 164, 36, 0.08));
          --dg-ink: var(--ink, #eaeef7);
          --dg-meta: var(--meta, #9aa3ba);
          --dg-faint: var(--faint, #7a8399);
          --dg-border: var(--border, #2b3145);
          --dg-accent: var(--accent-deep, #f2861a);
          --dg-accent-text: var(--link, #ffa424);
        }
      }

      .dg {
        font-family: var(--font-ui, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
      }

      .dg-bg { fill: var(--dg-ground); }

      .dg-panel { fill: var(--dg-panel-fill); stroke: var(--dg-border); stroke-width: 1.6; }
      .dg-card { fill: var(--dg-fill); stroke: var(--dg-ink); stroke-width: 1.8; }
      .dg-card-primary { fill: var(--dg-accent-fill); stroke: var(--dg-accent); stroke-width: 2.2; }
      .dg-card-strong { fill: var(--dg-fill-2); stroke: var(--dg-accent); stroke-width: 2.2; }
      .dg-card-quiet { fill: var(--dg-ground); stroke: var(--dg-meta); stroke-width: 1.4; }
      .dg-card-event { fill: var(--dg-accent-soft); stroke: var(--dg-accent); stroke-width: 1.8; stroke-dasharray: 6 5; }
      .dg-chip { fill: var(--dg-accent-soft); stroke: var(--dg-border); stroke-width: 1.2; }
      .dg-outline { fill: none; stroke: var(--dg-accent); stroke-width: 1.6; stroke-dasharray: 6 5; }

      .dg-title { font-size: 22px; fill: var(--dg-ink); }
      .dg-name { font-size: 17px; fill: var(--dg-ink); }
      .dg-lead { font-size: 15px; fill: var(--dg-meta); }
      .dg-sub { font-size: 14px; fill: var(--dg-meta); }
      .dg-label { font-size: 13px; fill: var(--dg-accent-text); letter-spacing: 0.06em; }
      .dg-label-quiet { font-size: 13px; fill: var(--dg-meta); letter-spacing: 0.06em; }
      .dg-note { font-size: 13px; fill: var(--dg-meta); font-style: italic; }
      .dg-foot { font-size: 13px; fill: var(--dg-faint); }
      .dg-mono { font-size: 13px; fill: var(--dg-ink); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }
      .dg-mono-accent { font-size: 13px; fill: var(--dg-accent-text); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }
      .dg-mono-quiet { font-size: 13px; fill: var(--dg-meta); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }

      .dg-line { fill: none; stroke: var(--dg-ink); stroke-width: 2; stroke-linecap: round; }
      .dg-line-accent { fill: none; stroke: var(--dg-accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 5; }
      .dg-line-quiet { fill: none; stroke: var(--dg-meta); stroke-width: 1.6; stroke-linecap: round; }
      .dg-guide { fill: none; stroke: var(--dg-border); stroke-width: 1.2; }
      .dg-divider { fill: none; stroke: var(--dg-border); stroke-width: 1.2; stroke-dasharray: 4 4; }

      .dg-arrow-head { fill: var(--dg-ink); }
      .dg-arrow-head-accent { fill: var(--dg-accent); }

      .dg-t-xs { font-size: 12px; }
      .dg-t-s { font-size: 13px; }
      .dg-t-m { font-size: 15px; }
      .dg-t-l { font-size: 18px; }
      .dg-t-xl { font-size: 21px; }
      .dg-t-2xl { font-size: 24px; }
      .dg-t-3xl { font-size: 28px; }
    </style>
  </defs>

  <rect class="dg-bg" width="1080" height="640"/>

  <!-- Divider -->
  <line class="dg-divider" x1="540" y1="60" x2="540" y2="600"/>

  <!-- ===================== Left panel: filesystem source ===================== -->
  <text class="dg-label" x="60" y="60">source 1</text>
  <text class="dg-title dg-t-3xl" x="60" y="94">Filesystem catalog</text>
  <text class="dg-sub dg-t-m" x="60" y="118">no server · no auth · zero infrastructure</text>

  <!-- Catalog folder card -->
  <rect class="dg-card" x="60" y="148" width="420" height="110" rx="6"/>
  <text class="dg-label" x="80" y="174">catalog</text>
  <text class="dg-name dg-t-xl" x="80" y="200">~/podium-artifacts/</text>
  <text class="dg-sub dg-t-m" x="80" y="222">personal/hello/greet/ARTIFACT.md</text>
  <text class="dg-sub dg-t-m" x="80" y="240">finance/run-variance/ARTIFACT.md</text>

  <path class="dg-line" d="M 270 262 L 270 302" marker-end="url(#dg-arrow-modes-filesystem-vs-server)"/>

  <!-- podium sync -->
  <rect class="dg-card-primary" x="170" y="308" width="200" height="60" rx="6"/>
  <text class="dg-name dg-t-xl" x="190" y="338">podium sync</text>
  <text class="dg-sub dg-t-m" x="190" y="358">reads the folder</text>

  <path class="dg-line" d="M 270 372 L 270 412" marker-end="url(#dg-arrow-modes-filesystem-vs-server)"/>

  <!-- Workspace -->
  <rect class="dg-card-strong" x="60" y="418" width="420" height="110" rx="6"/>
  <text class="dg-label" x="80" y="444">workspace</text>
  <text class="dg-name dg-t-xl" x="80" y="470">project/.claude/skills/greet/</text>
  <text class="dg-sub dg-t-m" x="80" y="492">written atomically by the harness adapter</text>
  <text class="dg-sub dg-t-m" x="80" y="510">.cursor/rules/, AGENTS.md, etc.</text>

  <text class="dg-foot" x="60" y="566">Fits anyone without access control or progressive discovery needs.</text>
  <text class="dg-foot" x="60" y="588">MCP server and language SDKs need a server source.</text>

  <!-- ===================== Right panel: server source ===================== -->
  <text class="dg-label" x="600" y="60">source 2</text>
  <text class="dg-title dg-t-3xl" x="600" y="94">Registry server</text>
  <text class="dg-sub dg-t-m" x="600" y="118">runtime discovery · identity-aware · audited</text>

  <!-- Sources row -->
  <rect class="dg-card" x="600" y="148" width="200" height="46" rx="6"/>
  <rect class="dg-card" x="820" y="148" width="200" height="46" rx="6"/>
  <text class="dg-name dg-t-xl" x="616" y="172">Git repo</text>
  <text class="dg-sub dg-t-m" x="616" y="188">team-shared @ main</text>
  <text class="dg-name dg-t-xl" x="836" y="172">Local path</text>
  <text class="dg-sub dg-t-m" x="836" y="188">/opt/podium/personal</text>

  <path class="dg-line" d="M 700 198 L 700 224 L 810 224 L 810 244" marker-end="url(#dg-arrow-modes-filesystem-vs-server)"/>
  <path class="dg-line" d="M 920 198 L 920 224 L 810 224"/>

  <!-- Server card -->
  <rect class="dg-card-primary" x="600" y="250" width="420" height="138" rx="8"/>
  <text class="dg-label" x="620" y="276">podium server</text>
  <text class="dg-name dg-t-xl" x="620" y="302">HTTP / JSON API</text>

  <rect class="dg-chip" x="620" y="316" width="180" height="28" rx="14"/>
  <rect class="dg-chip" x="812" y="316" width="190" height="28" rx="14"/>
  <rect class="dg-chip" x="620" y="352" width="180" height="28" rx="14"/>
  <rect class="dg-chip" x="812" y="352" width="190" height="28" rx="14"/>
  <text class="dg-name dg-t-m" x="636" y="335">SQLite or Postgres</text>
  <text class="dg-name dg-t-m" x="828" y="335">Layer composition</text>
  <text class="dg-name dg-t-m" x="636" y="371">Visibility filter</text>
  <text class="dg-name dg-t-m" x="828" y="371">Audit + dependency</text>

  <!-- Server -> consumers: trunk down to the junction, then three branches. -->
  <path class="dg-line" d="M 810 392 L 810 422"/>
  <path class="dg-line" d="M 810 422 L 660 422 L 660 452" marker-end="url(#dg-arrow-modes-filesystem-vs-server)"/>
  <path class="dg-line" d="M 810 422 L 810 452" marker-end="url(#dg-arrow-modes-filesystem-vs-server)"/>
  <path class="dg-line" d="M 810 422 L 960 422 L 960 452" marker-end="url(#dg-arrow-modes-filesystem-vs-server)"/>

  <!-- Consumers row -->
  <rect class="dg-card-strong" x="600" y="458" width="140" height="64" rx="6"/>
  <rect class="dg-card-strong" x="750" y="458" width="140" height="64" rx="6"/>
  <rect class="dg-card-strong" x="900" y="458" width="140" height="64" rx="6"/>
  <text class="dg-name dg-t-l" x="614" y="486">SDKs</text>
  <text class="dg-sub dg-t-m" x="614" y="506">py · ts</text>
  <text class="dg-name dg-t-l" x="764" y="486">MCP server</text>
  <text class="dg-sub dg-t-m" x="764" y="506">in-process</text>
  <text class="dg-name dg-t-l" x="914" y="486">podium sync</text>
  <text class="dg-sub dg-t-m" x="914" y="506">CLI · library</text>

  <text class="dg-foot" x="600" y="566">Required for runtime discovery, access control, or centralized audit.</text>
  <text class="dg-foot" x="600" y="588">Catalog usually lives in Git; the server ingests tracked refs.</text>
</svg>
