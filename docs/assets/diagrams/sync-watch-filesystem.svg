<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" class="dg">
  <!--
    podium sync watch mode against a filesystem-source registry (the
    long-running form invoked with the watch flag). fsnotify watches the
    registry path and the workspace overlay path, the watcher debounces the
    triggers, and each debounced trigger reruns the whole sync. A poll
    fallback fingerprints both trees when fsnotify cannot initialize.

    Layout matches sync-watch.svg: 40px outer margin, left column
    (x=40..460) for the trigger source, the debounce, and the loop back,
    right panel (x=520..1040) for the five steps of one run, target tree
    across the bottom.
  -->
  <defs>
    <marker id="dg-arrow-sync-watch-filesystem" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="dg-arrow-head" d="M 0 0 L 11 6 L 0 12 z"/>
    </marker>
    <marker id="dg-arrow-accent-sync-watch-filesystem" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="dg-arrow-head-accent" d="M 0 0 L 11 6 L 0 12 z"/>
    </marker>
    <style>
      /*
        Colour comes from the site's design tokens. Inlined in the documentation
        site the site's own variables win, so the theme toggle drives the
        diagram. Standing alone (raw markdown on github.com, or the file opened
        directly) the fallbacks apply and follow the operating system setting.
        The block below is identical in every diagram; edit all of them together.
      */
      :root {
        --dg-ground: var(--surface, #ffffff);
        --dg-panel-fill: var(--surface-2, #fdfdf8);
        --dg-fill: var(--surface-3, #f5f3e9);
        --dg-fill-2: var(--chip, #eae7d9);
        --dg-accent-fill: var(--accent-wash, #fff3e2);
        --dg-accent-soft: var(--accent-strip, #ffeeda);
        --dg-ink: var(--ink, #14130f);
        --dg-meta: var(--meta, #63604f);
        --dg-faint: var(--faint, #6f6c5e);
        --dg-border: var(--border, #d9d5c6);
        --dg-accent: var(--accent-deep, #f2861a);
        --dg-accent-text: var(--link, #a8480a);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --dg-ground: var(--surface, #171b28);
          --dg-panel-fill: var(--surface-2, #1e2434);
          --dg-fill: var(--surface-3, #1b2030);
          --dg-fill-2: var(--chip, #212739);
          --dg-accent-fill: var(--accent-wash, rgba(255, 164, 36, 0.12));
          --dg-accent-soft: var(--accent-strip, rgba(255, 164, 36, 0.08));
          --dg-ink: var(--ink, #eaeef7);
          --dg-meta: var(--meta, #9aa3ba);
          --dg-faint: var(--faint, #7a8399);
          --dg-border: var(--border, #2b3145);
          --dg-accent: var(--accent-deep, #f2861a);
          --dg-accent-text: var(--link, #ffa424);
        }
      }

      .dg {
        font-family: var(--font-ui, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
      }

      .dg-bg { fill: var(--dg-ground); }

      .dg-panel { fill: var(--dg-panel-fill); stroke: var(--dg-border); stroke-width: 1.6; }
      .dg-card { fill: var(--dg-fill); stroke: var(--dg-ink); stroke-width: 1.8; }
      .dg-card-primary { fill: var(--dg-accent-fill); stroke: var(--dg-accent); stroke-width: 2.2; }
      .dg-card-strong { fill: var(--dg-fill-2); stroke: var(--dg-accent); stroke-width: 2.2; }
      .dg-card-quiet { fill: var(--dg-ground); stroke: var(--dg-meta); stroke-width: 1.4; }
      .dg-card-event { fill: var(--dg-accent-soft); stroke: var(--dg-accent); stroke-width: 1.8; stroke-dasharray: 6 5; }
      .dg-chip { fill: var(--dg-accent-soft); stroke: var(--dg-border); stroke-width: 1.2; }
      .dg-outline { fill: none; stroke: var(--dg-accent); stroke-width: 1.6; stroke-dasharray: 6 5; }

      .dg-title { font-size: 22px; fill: var(--dg-ink); }
      .dg-name { font-size: 17px; fill: var(--dg-ink); }
      .dg-lead { font-size: 15px; fill: var(--dg-meta); }
      .dg-sub { font-size: 14px; fill: var(--dg-meta); }
      .dg-label { font-size: 13px; fill: var(--dg-accent-text); letter-spacing: 0.06em; }
      .dg-label-quiet { font-size: 13px; fill: var(--dg-meta); letter-spacing: 0.06em; }
      .dg-note { font-size: 13px; fill: var(--dg-meta); font-style: italic; }
      .dg-foot { font-size: 13px; fill: var(--dg-faint); }
      .dg-mono { font-size: 13px; fill: var(--dg-ink); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }
      .dg-mono-accent { font-size: 13px; fill: var(--dg-accent-text); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }
      .dg-mono-quiet { font-size: 13px; fill: var(--dg-meta); font-family: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }

      .dg-line { fill: none; stroke: var(--dg-ink); stroke-width: 2; stroke-linecap: round; }
      .dg-line-accent { fill: none; stroke: var(--dg-accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 5; }
      .dg-line-quiet { fill: none; stroke: var(--dg-meta); stroke-width: 1.6; stroke-linecap: round; }
      .dg-guide { fill: none; stroke: var(--dg-border); stroke-width: 1.2; }
      .dg-divider { fill: none; stroke: var(--dg-border); stroke-width: 1.2; stroke-dasharray: 4 4; }

      .dg-arrow-head { fill: var(--dg-ink); }
      .dg-arrow-head-accent { fill: var(--dg-accent); }

      .dg-t-xs { font-size: 12px; }
      .dg-t-s { font-size: 13px; }
      .dg-t-m { font-size: 15px; }
      .dg-t-l { font-size: 18px; }
      .dg-t-xl { font-size: 21px; }
      .dg-t-2xl { font-size: 24px; }
      .dg-t-3xl { font-size: 28px; }
    </style>
  </defs>

  <rect class="dg-bg" width="1080" height="630"/>

  <text class="dg-title" x="40" y="44">podium sync watch mode (filesystem-source registry)</text>
  <text class="dg-sub" x="40" y="68">A trigger reruns the whole sync. The run rewrites every selected artifact and deletes the paths that left the view.</text>

  <!-- Trigger source: fsnotify over the registry and overlay trees -->
  <rect class="dg-panel" x="40" y="96" width="420" height="198" rx="10"/>
  <text class="dg-label" x="62" y="124">filesystem catalog</text>

  <rect class="dg-card-primary" x="60" y="136" width="380" height="72" rx="8"/>
  <text class="dg-mono" x="78" y="166">~/podium-artifacts/ + .podium/overlay/</text>
  <text class="dg-sub" x="78" y="192">fsnotify over both trees, recursively</text>

  <rect class="dg-card-quiet" x="60" y="218" width="380" height="60" rx="6"/>
  <text class="dg-sub dg-t-s" x="78" y="242">poll fallback when fsnotify cannot start:</text>
  <text class="dg-sub dg-t-s" x="78" y="262">it fingerprints both trees every 500 ms</text>

  <!-- Trigger into the debounce -->
  <path class="dg-line-accent" d="M 150 294 L 150 324" marker-end="url(#dg-arrow-accent-sync-watch-filesystem)"/>
  <text class="dg-note" x="170" y="314">the changed path is not inspected</text>

  <!-- Debounce -->
  <rect class="dg-card" x="40" y="328" width="420" height="96" rx="8"/>
  <text class="dg-name" x="62" y="358">Debounce</text>
  <text class="dg-sub" x="62" y="382">one timer for both trees</text>
  <text class="dg-sub" x="62" y="404">a burst of edits becomes one run</text>

  <!-- Debounced trigger enters the run at step 1. -->
  <path class="dg-line" d="M 460 376 L 490 376 L 490 164 L 512 164" marker-end="url(#dg-arrow-sync-watch-filesystem)"/>

  <!-- One full sync run -->
  <rect class="dg-panel" x="520" y="96" width="520" height="344" rx="10"/>
  <text class="dg-label" x="542" y="124">one full sync run</text>

  <rect class="dg-card" x="540" y="140" width="480" height="48" rx="6"/>
  <text class="dg-label" x="558" y="170">1</text>
  <text class="dg-name dg-t-m" x="578" y="170">Resolve</text>
  <text class="dg-sub" x="676" y="170">the local layers, then the overlay</text>

  <rect class="dg-card" x="540" y="198" width="480" height="48" rx="6"/>
  <text class="dg-label" x="558" y="228">2</text>
  <text class="dg-name dg-t-m" x="578" y="228">Adapt</text>
  <text class="dg-sub" x="676" y="228">each selected artifact, harness writer</text>

  <rect class="dg-card" x="540" y="256" width="480" height="48" rx="6"/>
  <text class="dg-label" x="558" y="286">3</text>
  <text class="dg-name dg-t-m" x="578" y="286">Write</text>
  <text class="dg-sub" x="676" y="286">every file staged .tmp, then renamed</text>

  <rect class="dg-card" x="540" y="314" width="480" height="48" rx="6"/>
  <text class="dg-label" x="558" y="344">4</text>
  <text class="dg-name dg-t-m" x="578" y="344">Delete</text>
  <text class="dg-sub" x="676" y="344">every prior path this run did not write</text>

  <rect class="dg-card" x="540" y="372" width="480" height="48" rx="6"/>
  <text class="dg-label" x="558" y="402">5</text>
  <text class="dg-name dg-t-m" x="578" y="402">Lock</text>
  <text class="dg-sub" x="676" y="402">one .podium/sync.lock entry per path</text>

  <path class="dg-line" d="M 780 440 L 780 466" marker-end="url(#dg-arrow-sync-watch-filesystem)"/>

  <!-- Target tree -->
  <rect class="dg-card-strong" x="40" y="470" width="1000" height="72" rx="8"/>
  <text class="dg-label" x="62" y="500">target tree</text>
  <text class="dg-mono" x="62" y="526">.claude/agents/, .cursor/rules/, etc.</text>

  <!-- Loop back to the next trigger -->
  <path class="dg-line" d="M 250 466 L 250 428" marker-end="url(#dg-arrow-sync-watch-filesystem)"/>
  <text class="dg-note" x="266" y="452">await the next trigger</text>

  <text class="dg-foot" x="40" y="572">fsnotify watches the registry path and the workspace overlay path, and adds each new subdirectory as it appears.</text>
  <text class="dg-foot" x="40" y="590">Every run applies the active profile's scope and re-reads the lock file's toggles.</text>
  <text class="dg-foot" x="40" y="608">The directory is canonical, so the run evaluates no caller identity and no layer visibility.</text>
</svg>
