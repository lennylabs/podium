{{- include "podium.validate" . }}
{{- $migrationAnnotations := include "podium.migrationAnnotations" . | trim }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "podium.fullname" . }}
  labels:
    {{- include "podium.labels" . | nindent 4 }}
  {{- with $migrationAnnotations }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The strategy renders rollingUpdate explicitly under RollingUpdate, so the
  # release owns that field under server-side apply as well as client-side
  # apply. The API server defaults rollingUpdate onto a RollingUpdate
  # Deployment, and a field manager that never applied it cannot remove it, so
  # a later switch to Recreate would be rejected with
  # `spec.strategy.rollingUpdate: Forbidden`. Under Recreate the key is omitted
  # and any strategy.rollingUpdate value is ignored.
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq (toString .Values.strategy.type) "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ dig "rollingUpdate" "maxSurge" "25%" .Values.strategy }}
      maxUnavailable: {{ dig "rollingUpdate" "maxUnavailable" "25%" .Values.strategy }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "podium.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The selector pair wins over a podLabels entry of the same key, which
      # would otherwise render a duplicate key or detach the pod from its
      # Deployment and Service.
      labels:
        {{- toYaml (merge (include "podium.selectorLabels" . | fromYaml) (deepCopy (.Values.podLabels | default dict))) | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: podium-server
          image: {{ include "podium.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: 8080
              name: http
          {{- with include "podium.envFrom" . | trim }}{{ . | nindent 10 }}{{- end }}
          {{- with include "podium.env" . | trim }}{{ . | nindent 10 }}{{- end }}
          {{- if not .Values.migration.unprobedStart }}
          # The registry answers no probe path until its boot work finishes.
          # A start after a successful migrate Job finds the §13.4 completion
          # record and skips the rewrite, so the startup budget covers an
          # ordinary start. A signing-off first start, which cannot use the
          # Job, runs the rewrite at boot with migration.unprobedStart, which
          # omits this probe and the liveness probe so the kubelet never
          # restarts the pod mid-rewrite.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with include "podium.volumeMounts" . | trim }}{{ . | nindent 10 }}{{- end }}
      {{- with include "podium.volumes" . | trim }}{{ . | nindent 6 }}{{- end }}
      {{- with include "podium.scheduling" . | trim }}{{ . | nindent 6 }}{{- end }}
