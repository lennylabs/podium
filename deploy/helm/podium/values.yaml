# Default values for the Podium standard-topology chart.
# Override per spec §13.12 (Backend Configuration Reference).

image:
  repository: ghcr.io/lennylabs/podium
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 3

# Registry configuration (server-side).
config:
  endpoint: "https://podium.example.com"
  bind: "0.0.0.0:8080"

  store:
    type: postgres
    dsn: ""  # required; e.g. postgres://podium:pw@db.acme/podium?sslmode=require

  objectStore:
    type: s3
    bucket: ""
    region: us-east-1
    endpoint: ""  # set for MinIO/R2/GCS

  # Hybrid search is off by default so a bare `helm install` boots without an
  # embedding-provider credential. Turn it on by setting both of the following
  # and supplying the provider's key in the secret: vectorBackend.type to
  # pgvector (or pinecone/weaviate/qdrant, whose per-backend env vars from
  # §13.12 go in the same secret), and embeddingProvider.type to openai,
  # voyage, cohere, or ollama. A registry that selects an embedding provider
  # without its key exits at startup with
  # `missing required configuration for the selected backend(s)`.
  vectorBackend:
    type: none

  embeddingProvider:
    type: none
    model: text-embedding-3-small

  # The registry verifies oidc-jwt, trusted-headers, and injected-session-token
  # at request time. oauth-device-code is the client-side acquisition provider
  # and is refused here at startup with `config.identity_provider_unverified`
  # (§6.3.3). Supply the issuer, audience, and any provider secret through the
  # secret named in existingSecret, which reaches the pod via envFrom.
  #
  # Set type to "" to select no identity provider. The registry then resolves
  # every caller as anonymous and applies no per-layer visibility, which suits
  # an evaluation cluster and not a shared one.
  #
  # issuer is the oidc-jwt key. authorization_endpoint belongs to the
  # device-code flow and is read under no provider this chart can select, so
  # naming it here would produce a registry that does not start (§6.3.3).
  # Both default to empty and render only when set, so an operator who supplies
  # PODIUM_OAUTH_ISSUER or PODIUM_OAUTH_AUDIENCE through the secret keeps that
  # value. A non-empty default here would win instead: a container's env entry
  # overrides the same key arriving through envFrom, so a placeholder left in
  # this file would silently replace a correct secret-supplied endpoint.
  identityProvider:
    type: oidc-jwt
    audience: ""
    issuer: ""

  # Public mode bypasses authentication and the visibility model (§13.10). It
  # binds loopback unless the bind is explicitly allowed, and this chart renders
  # a 0.0.0.0 bind so the kubelet can reach the probes, so enabling public mode
  # without allowPublicBind fails at startup with `config.public_bind_refused`.
  # Setting both records the operator's decision to serve an open registry on a
  # cluster-reachable address. Public mode is mutually exclusive with an
  # identity provider: setting both fails with `config.public_mode_with_idp`.
  publicMode: false
  allowPublicBind: false

  # The §13.12 / §4.5.5 discovery block is config-file-only: it has no
  # environment variable, and this chart configures the registry through env.
  # Setting it here did nothing, so it is not offered. Supply it in a
  # registry.yaml mounted into the pod and pointed at by PODIUM_CONFIG_FILE.

# Existing secret holding sensitive values (DSNs, API keys, OIDC
# client secrets). The chart references the keys; supply your own
# secret rather than letting the chart create one with values.yaml.
existingSecret: "podium-secrets"

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

service:
  type: ClusterIP
  port: 8080

# An ingress and a prometheus-operator ServiceMonitor were declared here and no
# template rendered either, so setting them did nothing. They are removed rather
# than left as switches that report success and change nothing. Route to the
# Service with an ingress of your own, and scrape /metrics directly.

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
