# Default values for the Podium standard-topology chart.
# Override per spec §13.12 (Backend Configuration Reference).

image:
  repository: ghcr.io/lennylabs/podium
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 3

# Registry configuration (server-side).
config:
  endpoint: "https://podium.example.com"
  bind: "0.0.0.0:8080"

  store:
    type: postgres
    dsn: ""  # required; e.g. postgres://podium:pw@db.acme/podium?sslmode=require

  objectStore:
    type: s3
    bucket: ""
    # Blank so the secret can supply it. A non-empty default renders as a
    # container env entry, which overrides the same key arriving through
    # envFrom, so it would replace a correct secret-supplied region.
    region: ""
    endpoint: ""       # set for MinIO/R2/GCS
    s3ForcePathStyle: false  # set true for MinIO/R2/Ceph
    filesystemRoot: /objects  # used when type: filesystem

  # Hybrid search is off by default so an install needs no embedding-provider
  # credential. An install does need the signing key Secret named under
  # signing: below, or signing.mode set to none. Turn hybrid search on by setting both of the following
  # and supplying the provider's key in the secret: vectorBackend.type to
  # pgvector (or pinecone/weaviate/qdrant, whose per-backend env vars from
  # §13.12 go in the same secret), and embeddingProvider.type to openai,
  # voyage, cohere, or ollama. A registry that selects an embedding provider
  # without its key exits at startup with
  # `missing required configuration for the selected backend(s)`.
  vectorBackend:
    type: none

  embeddingProvider:
    type: none
    model: text-embedding-3-small

  # The registry verifies oidc-jwt, trusted-headers, and injected-session-token
  # at request time. oauth-device-code is the client-side acquisition provider
  # and is refused here at startup with `config.identity_provider_unverified`
  # (§6.3.3). Supply the issuer, audience, and any provider secret through the
  # secret named in existingSecret, which reaches the pod via envFrom.
  #
  # Set type to "" to select no identity provider. The registry then resolves
  # every caller as anonymous and applies no per-layer visibility, which suits
  # an evaluation cluster and not a shared one.
  #
  # issuer is the oidc-jwt key. authorization_endpoint belongs to the
  # device-code flow and is read under no provider this chart can select, so
  # naming it here would produce a registry that does not start (§6.3.3).
  # Both default to empty and render only when set, so an operator who supplies
  # PODIUM_OAUTH_ISSUER or PODIUM_OAUTH_AUDIENCE through the secret keeps that
  # value. A non-empty default here would win instead: a container's env entry
  # overrides the same key arriving through envFrom, so a placeholder left in
  # this file would silently replace a correct secret-supplied endpoint.
  identityProvider:
    type: oidc-jwt
    # audience reaches the pod as PODIUM_OAUTH_AUDIENCE and accepts a
    # comma-separated list of audience values the registry answers to. A token
    # is accepted when its aud claim carries one of them (§6.3.3).
    audience: ""
    issuer: ""
    groupsClaim: ""       # JWT claim that carries group membership
    # Comma-separated <token-group-value>=<group-name> pairs. The name on the
    # right is the group a layer's `groups:` filter names. A space-separated
    # value parses without error into one wrong entry.
    idpGroupMapping: ""

  # Public mode bypasses authentication and the visibility model (§13.10). It
  # binds loopback unless the bind is explicitly allowed, and this chart renders
  # a 0.0.0.0 bind so the kubelet can reach the probes, so enabling public mode
  # without allowPublicBind fails at startup with `config.public_bind_refused`.
  # Setting both records the operator's decision to serve an open registry on a
  # cluster-reachable address. Public mode is mutually exclusive with an
  # identity provider: setting both fails with `config.public_mode_with_idp`.
  publicMode: false
  allowPublicBind: false

  bootstrapAdmins: ""         # comma-separated list of admin identities on first boot
  defaultLayerVisibility: ""  # public | organization | private; empty uses server default

  # The deadline on each object-store read during the §13.4 rewrite of stored
  # rows, as a Go duration (for example 2m). It reaches both the registry and
  # the migrate Job as PODIUM_MIGRATION_OBJECT_READ_TIMEOUT. Empty keeps the
  # registry's 30s default. A read that exceeds it holds the row back as
  # body_unavailable, and the migration reports it.
  migrationObjectReadTimeout: ""

  # PODIUM_AUDIT_LOG_PATH for both the registry and the migrate Job. Empty
  # keeps the default file under the home directory, which the read-only root
  # filesystem cannot hold, so the audit events of a pod are dropped. An
  # http(s) endpoint ships them, including the artifact.signed events the
  # migration run appends for every row it signs.
  auditLogPath: ""

  # The §13.12 / §4.5.5 discovery block is config-file-only: it has no
  # environment variable, and this chart configures the registry through env.
  # Setting it here did nothing, so it is not offered. Supply it in a
  # registry.yaml mounted into the pod and pointed at by PODIUM_CONFIG_FILE.

# Existing secret holding sensitive values (DSNs, API keys, OIDC
# client secrets). The chart references the keys; supply your own
# secret rather than letting the chart create one with values.yaml.
existingSecret: "podium-secrets"

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# A prometheus-operator ServiceMonitor was declared here and no template
# rendered it, so setting it did nothing. It is removed rather than left as a
# switch that reports success and changes nothing. Scrape /metrics directly.
# The ingress below is rendered; see the `ingress:` block.

podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# The Deployment strategy. type is RollingUpdate or Recreate. Under
# RollingUpdate the chart renders rollingUpdate.maxSurge and
# rollingUpdate.maxUnavailable explicitly, each 25% when unset, so the release
# owns the field and a later switch to Recreate is accepted under server-side
# apply. Under Recreate it renders no rollingUpdate key and ignores the values
# below.
strategy:
  type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

# Startup budget for the registry container. The kubelet holds the liveness and
# readiness probes off until the startup probe succeeds, and the registry
# answers neither path until its boot work finishes. periodSeconds times
# failureThreshold is the budget: the defaults below give fifteen minutes. The
# budget covers an ordinary start. A release that migrates a stored value
# rewrites every stored row before it serves, and the chart runs that rewrite in
# the migrate Job below, so a start after a successful Job finds the completion
# record and skips it. A signing-off deployment cannot use the Job and runs the
# rewrite at boot with migration.unprobedStart, which removes this probe.
startupProbe:
  periodSeconds: 10
  failureThreshold: 90

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []

# Persistent volume for filesystem object store (config.objectStore.type: filesystem).
# Volume backing a filesystem object store. Every replica mounts the same
# claim, and ReadWriteOnce binds it to one node, so a multi-node cluster needs
# either an access mode of ReadWriteMany or replicaCount set to 1. Required
# when config.objectStore.type is filesystem.
objects:
  enabled: false
  existingClaim: ""
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# Registry signing key (§4.7.9, §13.10). The registry signs every artifact at
# ingest, and every replica signs under a key that every other replica's
# verification key set contains. In steady state every replica signs under the
# one key the chart mounts from one Secret, and during a rotation every replica
# trusts the new key before any replica signs under it. The chart mounts an
# operator-supplied Secret rather than letting each pod generate its own on a
# read-only root filesystem. The Secret holds the key file
# `podium admin signing-key generate --key-file <path>` writes, with its
# private: and public: lines, under the key named below. The file may also
# carry verify: lines, each a public key the registry trusts for verification
# only, which `podium admin signing-key rotate` writes for a key rotation. A
# render with no secretName fails unless mode is none.
#
# mode is registry-key or none. none turns ingest signing off; a consumer of
# such a registry then sets PODIUM_VERIFY_SIGNATURES=never, because under its
# default of always every unsigned artifact is refused.
signing:
  mode: registry-key
  secretName: ""
  mountPath: /signing
  # The key within secretName that holds the key file. The registry reads
  # mountPath/key as a file; mountPath itself is the directory the volume
  # mounts at.
  key: registry-signing.key

# Secret mounted as a volume for runtime-keys (identity provider: injected-session-token).
runtimeKeys:
  enabled: false
  secretName: ""
  mountPath: /keys
  # The key within secretName that holds the JSON key set. The registry reads
  # mountPath/key as a file; mountPath itself is the directory the volume
  # mounts at, and naming it instead fails the boot.
  key: runtime-keys.json

# The §13.4 stored-value migration. The first start of a release that migrates
# a stored value rewrites every stored row before it serves, and it requires
# every registry process on the previous release stopped first. The chart runs
# that rewrite as a Job, `podium-server sign-stored-rows`, rendered as a Helm
# post-upgrade hook while the Deployment is held at replicaCount 0. The upgrade
# procedure in docs/deployment/clustered.md sets mode and reviewedDryRun per
# step with --set; keep those two at their defaults in a values file. A
# controller that renders every revision as an install keeps storeReady: true
# in its values.
#
# Every lookup-based gate below needs the Helm user to hold get on Deployments,
# Jobs, and Secrets and list on Pods in the release namespace. A renderer that runs
# without cluster access, such as `helm template`, skips lookup, so the image
# and reviewed-dry-run gates fail closed there, and a serving upgrade render
# requires storeReady.
migration:
  # disabled, dry-run, or run. A mode renders the Job and requires
  # replicaCount 0, signing.mode registry-key, and a helm upgrade. dry-run
  # lists every row the run would write and writes no row; run performs the
  # rewrite and records its completion. The value is the string "disabled"
  # because YAML reads an unquoted off as false.
  mode: disabled
  # Passes --include-unsigned in both dry-run and run, so the dry run lists
  # with sign=true every unsigned row the run attests. The run must use the
  # setting of the dry run it names. Set false for both steps to leave
  # unsigned rows unsigned.
  includeUnsigned: true
  # The UID of the succeeded dry-run Job the operator reviewed, which
  # `kubectl get job <release>-podium-migrate -o jsonpath='{.metadata.uid}'`
  # prints. run requires it and refuses a Job from another image, another
  # includeUnsigned setting, an earlier release revision, another pod
  # configuration, or another Deployment.
  reviewedDryRun: ""
  # A helm install with replicaCount above 0 requires true, which states that
  # the store is empty or already migrated, and so does a helm upgrade with
  # replicaCount above 0 that finds no live Deployment. The chart cannot see the store, and
  # a store outlives helm uninstall. An install over a store the previous
  # release wrote installs at replicaCount 0 and follows the upgrade procedure.
  # An install at replicaCount 0 with storeReady true records the migration as
  # complete.
  storeReady: false
  # The image the store's previous registry ran, such as
  # ghcr.io/lennylabs/podium-server:v0.4.0. A helm install at replicaCount 0
  # requires it unless storeReady is true. The install has no live Deployment
  # to read the previous image from, so it records this value, and the image
  # gate refuses a migrate Job on that image.
  previousImage: ""
  # The lookup gates: the stop gate, the image gate, the reviewed-dry-run gate,
  # and the serving preflight that refuses to scale the Deployment above zero
  # over a store that has not been migrated. false is the operator's assertion
  # that every registry process is stopped, the image is this release, the
  # plan was reviewed, and the rewrite is complete. With false, only a render
  # with replicaCount above 0 records the migration as complete.
  preflight: true
  # The signing-off path. sign-stored-rows refuses with signing off, so such a
  # deployment runs the rewrite at boot. true removes the startup and liveness
  # probes so the kubelet never restarts the pod mid-rewrite, and it requires
  # signing.mode none, replicaCount 1, strategy.type Recreate, and mode
  # disabled.
  unprobedStart: false
  backoffLimit: 0
  # 0 renders no activeDeadlineSeconds. Helm waits on the hook only up to
  # --timeout, so pass a --timeout larger than this value.
  activeDeadlineSeconds: 0
  # Merged per key over resources above, so a key set here replaces only that
  # key and the Job keeps the rest. The plan holds every row in memory, so a
  # large store raises limits.memory here.
  resources: {}
  # Merged over podAnnotations on the Job pod only, winning per key. On a
  # service mesh without native sidecars an injected sidecar keeps running
  # after the command exits and the Job never completes; set the mesh's
  # opt-out here, such as sidecar.istio.io/inject: "false" or
  # linkerd.io/inject: disabled, when the store is reachable without the mesh.
  # The chart sets none by default, because a mesh that enforces mTLS to the
  # store would then block the Job.
  podAnnotations: {}
  # Merged over podLabels on the Job pod only, winning per key; the Job's own
  # name, instance, and component labels win over both. A mesh reads its
  # injection label ahead of its annotation, so when podLabels enables
  # injection, such as sidecar.istio.io/inject: "true", set the opt-out label
  # here, such as sidecar.istio.io/inject: "false".
  podLabels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls: []

# Bundled single-replica Postgres — for evaluation and single-node pilots only.
# Set postgresql.existingSecret to a secret with key "password"; the same secret
# is the source for both the database's own password and the DSN the registry
# connects with, which the deployment derives, so no DSN is written by hand.
# §13.1 pairs a production Postgres with read replicas, which this single
# replica is not. For production, use an external managed database, leave this
# disabled, and supply PODIUM_POSTGRES_DSN through existingSecret. Enabling both
# at once resolves to the bundled database: the derived DSN is set on the
# container directly and takes precedence over the one existingSecret carries.
postgresql:
  enabled: false
  fullnameOverride: ""
  image: postgres:17-alpine
  imagePullPolicy: IfNotPresent
  database: podium
  username: podium
  existingSecret: ""
  passwordKey: password
  # Empty by default: the image drops to the postgres user itself and needs a
  # writable data directory, so the registry's context does not transfer.
  podSecurityContext: {}
  securityContext: {}
  podAnnotations: {}
  resources: {}
  persistence:
    size: 10Gi
    storageClass: ""
