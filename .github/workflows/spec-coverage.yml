name: spec-coverage

on:
  pull_request:

jobs:
  speccov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The chart NOTES tests render through Helm v4's client-side dry run;
      # the runner's preinstalled Helm v3 needs a cluster for it.
      - uses: azure/setup-helm@v5
        with:
          version: v4.1.4

      - run: make tools
      - name: Spec section coverage
        run: |
          ./bin/speccov report
          ./bin/speccov uncovered || true
          ./bin/speccov drift
      - name: Matrix audit
        run: ./bin/matrix audit
      - name: Doc-example coverage
        run: |
          ./bin/doccov report
          ./bin/doccov check
      - name: Coverage budget
        run: make coverage-budget
