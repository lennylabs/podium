name: docs

# The documentation site (docs/ markdown, rendered by the generator in site/) is
# regenerated only on a new release tag, not on every push to main. The
# repository's Pages source is set to "GitHub Actions" so the legacy per-commit
# branch build is disabled and this workflow is the only deploy path.
# workflow_dispatch allows a manual rebuild between releases, for example a
# docs-only correction.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments; let an in-progress deploy finish rather than
# cancelling it, so a release publish is never left half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Each page shows when its source last changed, which is read from the
          # commit history. A shallow clone carries none, so the dates would all
          # come back empty.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
